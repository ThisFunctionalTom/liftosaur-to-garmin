name: Build and deploy PWA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: dotnet tool restore
      - run: npm ci --prefix web
      - name: Check shared logic and API scripts
        run: |
          dotnet fsi conversion.tests.fsx
          dotnet fsi liftosaur.tests.fsx
          dotnet fsi syncPrograms.tests.fsx
      - name: Compare browser and .NET FIT output
        run: npm test --prefix web
      - name: Refresh workout summary
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          LIFTOSAUR_API_KEY: ${{ secrets.LIFTOSAUR_API_KEY }}
        run: |
          if [ -z "$LIFTOSAUR_API_KEY" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Add LIFTOSAUR_API_KEY under repository Settings > Secrets and variables > Actions."
              exit 1
            fi
            echo "::warning::LIFTOSAUR_API_KEY is not configured; building with the checked-in summary."
          else
            dotnet fsi progress/generate.fsx
          fi
      - name: Build static app
        run: npm run build --prefix web
      - name: Install test browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Check downloads and offline PWA
        working-directory: web
        run: npx playwright test
      - name: Upload static site
        if: vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist

  deploy:
    if: vars.PAGES_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
